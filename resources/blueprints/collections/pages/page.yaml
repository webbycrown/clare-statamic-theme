title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          - { handle: title, field: { type: text, required: true, validate: [required] } }
          - { handle: template, field: { type: template, display: Template } }
          - { import: all_page_builder }
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          - { handle: slug, field: { type: slug, validate: 'max:200' } }
