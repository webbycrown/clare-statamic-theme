<main class="site-primary">
  <section class="heading-banner-section">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="heading-banner-wrap">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">Categories</li>
              </ol>
            </nav>
            <h1>Categories</h1>
            <div class="heading-banner-img">
              <img src="/assets/images/heading-banner-img.png" alt="">
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="popular-categories-section section-all">
    <div class="container">
      <div class="popular-categories-grid">
        {{ taxonomy:product_category }}
        <div class="popular-categories">
          <div class="popular-categories-img">
            <a href="/categories/{{ slug }}">
              {{ if image }}<img src="{{ image:url }}" alt="{{ title }}">
              {{ else }}<img src="/assets/images/categories-img1.jpg" alt="{{ title }}">{{ /if }}
            </a>
          </div>
          <div class="popular-categories-title">
            <h6><a href="/categories/{{ slug }}">{{ title }}</a></h6>
          </div>
        </div>
        {{ /taxonomy:product_category }}
      </div>
    </div>
  </section>
</main>
