<!-- Best Sellers section -->
<section class="bestsellers-products-section section-two">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="module-header">
					<h2 class="entry-title">{{ heading ?? 'Best Sellers' }}</h2>
				</div>
				<div class="bestsellers-products-grid">
					<div class="row">
						{{ clare_products paginate="{{ limit ?? 8 }}" }}
						<div class="col-12 col-sm-6 col-md-4 col-lg-3">
							<div class="product product-style-3">
								<div class="product-thumbnail">
									<a href="{{ url }}" class="thumbnail">
										{{ if image }}<img src="{{ image:url }}" alt="{{ title }}">
										{{ else }}<img src="/assets/images/best-sellers-img1.jpg" alt="{{ title }}">{{ /if }}
									</a>
									<div class="product-hover-button">
										<a href="{{ url }}" class="select-option-btn">Select option</a>
									</div>
									<div class="product-buttons-icon">
										<a href="{{ url }}" class="arrow-icon"><span class="ti-eye"></span></a>
										<a href="/shop" class="arrow-icon"><span class="ti-shopping-cart"></span></a>
										<a href="/account" class="arrow-icon"><span class="ti-heart"></span></a>
									</div>
								</div>
								<div class="product-content">
									<h3 class="product-title"><a href="{{ url }}">{{ title }}</a></h3>
									<span class="price"><ins>{{ price | clare_money }}</ins></span>
								</div>
							</div>
						</div>
						{{ /clare_products }}
						<div class="col-12">
							<div class="section-full-btn">
								<a href="{{ button_url ?? '/shop' }}" class="btn btn-dark btn-style-2">{{ button_label ?? 'Explore more' }}</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
<!--/ End Best Sellers section -->
