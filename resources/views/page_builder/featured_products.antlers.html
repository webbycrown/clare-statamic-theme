<!-- Feature Products section -->
<section class="feature-products-section section-all">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="module-header">
					<h2 class="entry-title">{{ heading ?? 'Feature Products' }}</h2>
					<div class="entry-header-right">
						<a href="{{ button_url ?? '/shop' }}" class="btn link">{{ button_label ?? 'Shop all' }} <span class="ti-arrow-right"></span></a>
					</div>
				</div>
				<div class="feature-products-grid">
					{{ clare_products paginate="{{ limit ?? 8 }}" }}
					{{ partial:cards/product }}
					{{ /clare_products }}
				</div>
			</div>
		</div>
	</div>
</section>
<!--/ End Feature Products section -->
