<!-- Hero banner section -->
<section class="hero-banner-section">
	<div class="hero-banner-body">
		<div class="container">
			<div class="row align-items-center">
				<div class="col-12 col-md-6">
					<div class="hero-banner-content">
						{{ if heading }}<h1>{{ heading }}</h1>{{ else }}<h1>The Purl Coat Cardigan</h1>{{ /if }}
						{{ if text }}<p>{{ text }}</p>{{ /if }}
						<a href="{{ button_url ?? '/shop' }}" class="btn-link">{{ button_label ?? 'Shop Now' }}</a>
					</div>
				</div>
				<div class="col-12 col-md-6">
					<div class="hero-banner-img">
						{{ if image }}
						<img src="{{ partial:partials/media-url :file='image' }}" alt="{{ heading }}">
						{{ else }}
						<img src="/assets/images/hero-banner-img.png" alt="hero-banner-img">
						{{ /if }}
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
<!--/ End Hero banner section -->
