<!-- Weekly best sell section -->
<section class="weekly-products-section section-all">
	<div class="container">
		<div class="row">
			<div class="col-12">
				<div class="module-header">
					<h2 class="entry-title">{{ heading ?? 'Weekly best sell' }}</h2>
					<div class="entry-header-right">
						<a href="/shop" class="btn link">Shop all <span class="ti-arrow-right"></span></a>
					</div>
				</div>
				<div class="row">
					{{ clare_products paginate="{{ limit ?? 6 }}" }}
					<div class="col-12 col-md-6 col-lg-4">
						<div class="weekly-products product">
							<div class="weekly-products-thumbnail">
								<a href="{{ url }}" class="thumbnail">
									{{ if image }}<img src="{{ image:url }}" alt="{{ title }}">{{ else }}<img src="/assets/images/weekly-product-img1.jpg" alt="{{ title }}">{{ /if }}
								</a>
							</div>
							<div class="product-content">
								<h3 class="product-title"><a href="{{ url }}">{{ title }}</a></h3>
								<span class="price"><ins>{{ price | clare_money }}</ins></span>
								<div class="product-buttons">
									<a href="{{ url }}" class="btn btn-light add_to_cart_button">Add to cart</a>
								</div>
							</div>
						</div>
					</div>
					{{ /clare_products }}
				</div>
			</div>
		</div>
	</div>
</section>
<!--/ End Weekly best sell section -->
