<!-- primary nav using nav:header_menu -->
<nav class="site-nav horizontal primary-nav">
	<ul class="menu">
		{{ nav:header_menu }}
		<li class="menu-item{{ if children }} menu-item-has-children{{ /if }}{{ if is_current or is_parent }} active{{ /if }}">
			<a href="{{ url ?? 'javascript:;' }}">{{ title }}</a>
			{{ if children }}
			<ul class="sub-menu">
				{{ children }}
				<li class="{{ if is_current or is_parent }}active{{ /if }}">
					<a href="{{ url ?? '#' }}">{{ title }}</a>
				</li>
				{{ /children }}
			</ul>
			{{ /if }}
		</li>
		{{ /nav:header_menu }}
	</ul>
</nav>
